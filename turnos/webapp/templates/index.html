<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnos del campamento</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="cabecera">
    <div class="marca">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 12 4l9 16z"/><path d="M12 4v16"/><path d="M9 20l3-6 3 6"/></svg>
      <span>Turnos del campamento</span>
    </div>
    <nav id="nav">
      <button class="nav-btn" data-pagina="rejilla">Rejilla</button>
      <button class="nav-btn" data-pagina="disponibilidad">Disponibilidad</button>
      <button class="nav-btn" data-pagina="monitores">Monitores</button>
      <button class="nav-btn" data-pagina="turnos">Turnos y dependientes</button>
      <button class="nav-btn" data-pagina="restricciones">Restricciones</button>
      <button class="nav-btn" data-pagina="informe">Informe</button>
      <button class="nav-btn" data-pagina="versiones">Versiones</button>
    </nav>
    <div class="cabecera-der">
      <div id="resumen-excel" class="resumen-texto"></div>
      <details id="carga-excel" class="menu-excel">
        <summary>Campamento</summary>
        <div class="menu-excel-cuerpo">
          <label>Campamento abierto
            <select id="sel-campamento"></select>
          </label>
          <div class="menu-botones">
            <button id="btn-nuevo-camp" type="button">Nuevo campamento…</button>
            <button id="btn-importar" type="button" class="secundario">Importar un Excel…</button>
            <a class="enlace-boton" href="/api/descargar" title="Descargar una copia en formato Excel">Descargar Excel</a>
          </div>
          <input type="file" id="fichero-excel" accept=".xlsx,.xlsm" hidden>
          <details class="avanzado">
            <summary>Abrir por ruta</summary>
            <input type="text" id="input-ruta">
            <button id="btn-cargar" type="button" class="secundario">Cargar / recargar</button>
          </details>
          <span id="estado-carga"></span>
        </div>
      </details>
    </div>
  </header>
  <div id="avisos-excel"></div>

  <main id="contenido"></main>

  <script src="/static/rejilla.js"></script>
  <script src="/static/herramientas.js"></script>
  <script src="/static/disponibilidad.js"></script>
  <script src="/static/campamentos.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
