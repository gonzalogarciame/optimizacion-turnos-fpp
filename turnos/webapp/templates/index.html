<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnos del campamento</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="cabecera">
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">⛺</span>
      <div>
        <h1>Turnos del campamento</h1>
        <p>Fundación Proyecto Persona</p>
      </div>
    </div>
    <div id="resumen-excel" class="resumen-chips"></div>
    <details id="carga-excel" class="menu-excel">
      <summary>Excel en uso</summary>
      <div class="menu-excel-cuerpo">
        <label>Ruta del fichero
          <input type="text" id="input-ruta">
        </label>
        <button id="btn-cargar">Cargar / recargar</button>
        <span id="estado-carga"></span>
      </div>
    </details>
  </header>
  <div id="avisos-excel"></div>

  <div id="cuerpo">
    <nav id="nav">
      <button class="nav-btn" data-pagina="rejilla"><i>📅</i><span>Rejilla de turnos</span></button>
      <button class="nav-btn" data-pagina="monitores"><i>👥</i><span>Monitores</span></button>
      <button class="nav-btn" data-pagina="disponibilidad"><i>🗓️</i><span>Disponibilidad</span></button>
      <button class="nav-btn" data-pagina="turnos"><i>🧩</i><span>Turnos y dependientes</span></button>
      <button class="nav-btn" data-pagina="restricciones"><i>⚙️</i><span>Restricciones</span></button>
      <button class="nav-btn" data-pagina="informe"><i>📊</i><span>Informe</span></button>
    </nav>
    <main id="contenido"></main>
  </div>

  <script src="/static/rejilla.js"></script>
  <script src="/static/herramientas.js"></script>
  <script src="/static/disponibilidad.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
